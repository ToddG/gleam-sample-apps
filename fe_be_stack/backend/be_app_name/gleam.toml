pkg_plist_lines = [ 
]

[[freebsd.dependencies]]
name = "gleam"
version = "1.18.1_1"
origin = "lang/gleam"

[[freebsd.dependencies]]
name = "erlang-28"
version = "28.5.0.8,4"
origin = "lang/erlang"

[[freebsd.dependencies]]
name = "erlang-runtime28"
version = "28.5.0.8"
