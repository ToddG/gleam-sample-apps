pkg_licenses = ["PRIVATE"]
pkg_description = """
THIS IS A PRIVATE PACKAGE!!!
PROPERTY OF GENERAL WILDFIRE SERVICES, LLC 
AND TODD GREENWOOD-GEER.
"""
pkg_maintainer = "toddg@generalwildfireservices"
